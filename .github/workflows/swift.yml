name: Build macOS and mobile apps

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "website/**"
      - ".github/workflows/website.yml"
  pull_request:
    branches: ["main"]
    paths-ignore:
      - "website/**"
      - ".github/workflows/website.yml"

jobs:
  macos:
    name: macOS
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Build
        run: |
          xcodebuild -project RealityPulse.xcodeproj \
            -scheme RealityPulse \
            -configuration Debug \
            -destination 'platform=macOS' \
            build

  mobile:
    name: iPhone and iPad
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Choose simulators
        run: |
          echo "IPHONE_SIMULATOR=$(python3 .github/scripts/pick-simulator.py iPhone)" >> "$GITHUB_ENV"
          echo "IPAD_SIMULATOR=$(python3 .github/scripts/pick-simulator.py iPad)" >> "$GITHUB_ENV"

      - name: Build for iPhone
        run: |
          xcodebuild -project RealityPulse.xcodeproj \
            -scheme RealityPulse \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$IPHONE_SIMULATOR" \
            build

      - name: Build for iPad
        run: |
          xcodebuild -project RealityPulse.xcodeproj \
            -scheme RealityPulse \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$IPAD_SIMULATOR" \
            build

      - name: Run tests on iPhone
        run: |
          xcodebuild -project RealityPulse.xcodeproj \
            -scheme RealityPulse \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$IPHONE_SIMULATOR" \
            test
