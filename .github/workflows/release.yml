name: Release macOS app

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build, for example v1.1.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Run tests
        run: |
          xcodebuild -project RealityPulse.xcodeproj \
            -scheme RealityPulse \
            -configuration Debug \
            -destination 'platform=macOS' \
            test

      - name: Build Release app
        run: |
          xcodebuild -project RealityPulse.xcodeproj \
            -scheme RealityPulse \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_IDENTITY="-" \
            build

      - name: Package app
        run: |
          APP_PATH="build/DerivedData/Build/Products/Release/Reality Pulse.app"
          VERSION="${GITHUB_REF_NAME}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.tag }}"
          fi

          mkdir -p build/release
          ditto -c -k --keepParent "$APP_PATH" "build/release/Reality-Pulse-${VERSION}.zip"
          shasum -a 256 "build/release/Reality-Pulse-${VERSION}.zip" > "build/release/Reality-Pulse-${VERSION}.zip.sha256"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Reality-Pulse
          path: |
            build/release/*.zip
            build/release/*.sha256

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          name: Reality Pulse ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            build/release/*.zip
            build/release/*.sha256
